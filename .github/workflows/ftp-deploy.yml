name: FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize FTP remote directory
        env:
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          if [ -z "$FTP_REMOTE_DIR" ]; then
            echo "::error title=Missing FTP_REMOTE_DIR secret::Set the FTP_REMOTE_DIR repository secret to the target FTP directory."
            exit 1
          fi

          case "$FTP_REMOTE_DIR" in
            */) echo "FTP_REMOTE_DIR=$FTP_REMOTE_DIR" >> "$GITHUB_ENV" ;;
            *) echo "FTP_REMOTE_DIR=$FTP_REMOTE_DIR/" >> "$GITHUB_ENV" ;;
          esac

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ env.FTP_REMOTE_DIR }}

# Instructions:
# - Add the following repository secrets in GitHub: FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_REMOTE_DIR
# - FTP_REMOTE_DIR is the path on the server that maps to the document root (for example: public_html/ or /www/yourdomain.com/)
# - This action will upload the repository root files on every push to main. Adjust `local-dir` if you want to upload a subfolder.
